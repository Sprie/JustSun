name: Verify JSP-000664 upstream proof

on:
  push:
    paths:
      - "evidence/JSP-000664.md"
      - ".github/workflows/verify-jsp-000664.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned upstream proof
        run: |
          git clone --filter=blob:none https://github.com/plby/lean-proofs.git upstream
          cd upstream
          git checkout 8822f7ddef30fadbd92e1c6ab4ed897af356af5e
          test "$(git rev-parse HEAD)" = "8822f7ddef30fadbd92e1c6ab4ed897af356af5e"

      - name: Resolve pinned dependencies
        working-directory: upstream/src/latest
        run: lake update

      - name: Fetch Mathlib cache
        working-directory: upstream/src/latest
        run: lake exe cache get

      - name: Build Erdos807
        working-directory: upstream/src/latest
        run: lake build ErdosProblems.Erdos807

      - name: Axiom audit
        working-directory: upstream/src/latest
        run: |
          cat > Audit807.lean <<'EOF'
          import ErdosProblems.Erdos807
          #check Erdos807.not_erdos_807
          #check Erdos807.alon_bohman_huang
          #print axioms Erdos807.not_erdos_807
          #print axioms Erdos807.alon_bohman_huang
          EOF
          lake env lean Audit807.lean
