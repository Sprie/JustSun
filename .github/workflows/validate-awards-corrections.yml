name: Validate awards correction branches

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/validate-awards-corrections.yml"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: JSP-000173
            branch: jsp-000173-register-existing-lean
          - label: JSP-000517
            branch: jsp-000517-register-existing-lean
          - label: JSP-000699
            branch: jsp-000699-register-existing-lean
          - label: JSP-000747
            branch: jsp-000747-register-existing-lean
          - label: JSP-000916
            branch: jsp-000916-register-existing-lean
          - label: JSP-000568
            branch: jsp-000568-register-full-existing-lean
          - label: JSP-000861
            branch: jsp-000861-register-erdos1038-solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Sprie awards branch
        run: |
          git clone --branch "${{ matrix.branch }}" https://github.com/Sprie/awards.git awards

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official validation dependencies
        working-directory: awards
        run: python -m pip install -r requirements.txt

      - name: Validate records
        working-directory: awards
        run: python scripts/manage.py validate

      - name: Validate history against upstream base
        working-directory: awards
        run: python scripts/manage.py history --base ff33abd13163e789790eb1014e55f57c05f94432

      - name: Validate links
        working-directory: awards
        run: python scripts/manage.py links

      - name: Build generated data
        working-directory: awards
        run: python scripts/manage.py build

      - name: Check generated consistency
        working-directory: awards
        run: python scripts/manage.py check

      - name: Run unit tests
        working-directory: awards
        run: python -m unittest discover -s tests -v

      - name: Diff hygiene
        working-directory: awards
        run: git diff --check

# refresh: JSP-000568 full-proof correction branch
# refresh: JSP-000173 existing-proof correction branch